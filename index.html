<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reduction Tape Scanner</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header>

        <h1>Reduction Tape Scanner</h1>

        <p>
            AI Assisted Reduction Tape Market Scanner
        </p>

    </header>

    <!-- ========================================= -->
    <!-- SYMBOL SEARCH -->
    <!-- ========================================= -->

    <section class="card">

        <h2>Search Symbol</h2>

        <div class="searchWrapper">

            <div class="searchRow">

                <input
                    id="symbolInput"
                    type="text"
                    placeholder="Search Company, Symbol or Index..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button id="searchBtn">

                    Search

                </button>

            </div>

            <div id="searchResults"></div>

        </div>

    </section>

    <!-- ========================================= -->
    <!-- DATE RANGE -->
    <!-- ========================================= -->

    <section class="card">

        <h2>Date Range</h2>

        <div class="dateRow">

            <div>

                <label>From</label>

                <input
                    type="date"
                    id="fromDate"
                >

            </div>

            <div>

                <label>To</label>

                <input
                    type="date"
                    id="toDate"
                >

            </div>

            <button id="calculateBtn">

                Calculate

            </button>

        </div>

    </section>

    <!-- ========================================= -->
    <!-- REDUCTION LEVELS -->
    <!-- ========================================= -->

    <section class="card">

        <h2>Reduction Levels</h2>

        <div class="levelsGrid">

            <div class="levelCard upper">

                <span>Upper TDP</span>

                <h3 id="upperTdp">—</h3>

            </div>

            <div class="levelCard sp">

                <span>SP</span>

                <h3 id="sp">—</h3>

            </div>

            <div class="levelCard close">

                <span>Close</span>

                <h3 id="close">—</h3>

            </div>

            <div class="levelCard bp">

                <span>BP</span>

                <h3 id="bp">—</h3>

            </div>

            <div class="levelCard lower">

                <span>Lower TDP</span>

                <h3 id="lowerTdp">—</h3>

            </div>

        </div>

    </section>

    <!-- ========================================= -->
    <!-- MARKET ENGINE -->
    <!-- ========================================= -->

    <section class="card">

        <h2>Market Engine</h2>

        <div class="engineGrid">

            <div class="engineCard">

                <label>Direction</label>

                <h3 id="direction">—</h3>

            </div>

            <div class="engineCard">

                <label>State</label>

                <h3 id="scenario">—</h3>

            </div>

            <div class="engineCard">

                <label>Current Target</label>

                <h3 id="currentTarget">—</h3>

            </div>

            <div class="engineCard">

                <label>Next Target</label>

                <h3 id="nextTarget">—</h3>

            </div>

        </div>

    </section>

    <!-- ========================================= -->
    <!-- LIVE MONITOR -->
    <!-- ========================================= -->

    <section class="card">

        <h2>Live Monitor</h2>

        <div class="monitorGrid">

            <div>

                <label>Live Price</label>

                <h3 id="livePrice">—</h3>

            </div>

            <div>

                <label>Today's Open</label>

                <h3 id="marketOpen">—</h3>

            </div>

            <div>

                <label>Signal</label>

                <h3 id="signal">

                    WAIT

                </h3>

            </div>

            <div>

                <label>Watch Zone</label>

                <h3 id="watchZone">—</h3>

            </div>

            <div>

                <label>Breakout Buffer</label>

                <h3 id="breakoutBuffer">—</h3>

            </div>

            <div>

                <label>Reversal Buffer</label>

                <h3 id="reversalBuffer">—</h3>

            </div>

            <div class="reasonBox">

                <label>Reason</label>

                <p id="reason">

                    Waiting...

                </p>

            </div>

        </div>

        <hr>

        <div class="distanceGrid">

            <div>

                Upper TDP

                <span id="distUpper">

                    —

                </span>

            </div>

            <div>

                SP

                <span id="distSP">

                    —

                </span>

            </div>

            <div>

                Close

                <span id="distClose">

                    —

                </span>

            </div>

            <div>

                BP

                <span id="distBP">

                    —

                </span>

            </div>

            <div>

                Lower TDP

                <span id="distLower">

                    —

                </span>

            </div>

        </div>

        <button id="startMonitoring">

            Start Monitoring

        </button>

    </section>

</div>

<script src="js/api.js"></script>

<script src="js/dashboard.js"></script>

</body>

</html>
